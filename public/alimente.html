<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eat Track — Alimente</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eat Track" />
    <link rel="apple-touch-icon" href="icon.svg" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">🥫</span>
        <h1>Eat Track</h1>
        <span id="engine-badge" class="badge" hidden></span>
      </div>
    </header>

    <nav class="tabs">
      <a class="tab" href="index.html">🍽️ Mese</a>
      <a class="tab" href="greutate.html">⚖️ Greutate</a>
      <a class="tab" href="obiective.html">🎯 Obiective</a>
      <a class="tab active" href="alimente.html">🥫 Alimente</a>
    </nav>

    <main>
      <!-- Adauga produs -->
      <section class="card">
        <h2>➕ Adaugă un produs</h2>
        <p class="hint">
          Valorile sunt <b>per 100&nbsp;g</b>. După ce salvezi, produsul e
          recunoscut automat când scrii o masă (ex: „150g nume produs").
        </p>
        <div class="row">
          <input
            id="food-code"
            type="text"
            inputmode="numeric"
            placeholder="cod de bare (opțional) — completează automat"
          />
          <button type="button" id="food-lookup" class="ghost">Caută cod</button>
        </div>
        <div id="food-lookup-status" class="hint"></div>
        <form id="food-form" class="food-form">
          <label class="food-name">Nume produs
            <input id="food-name" type="text" placeholder="ex: iaurt grecesc Lidl" required />
          </label>
          <div class="food-macros">
            <label>🔥 Calorii
              <input id="food-calories" type="number" step="0.1" min="0" placeholder="kcal" required />
            </label>
            <label>🥩 Proteine
              <input id="food-protein" type="number" step="0.1" min="0" placeholder="g" />
            </label>
            <label>🍞 Carbohidrați
              <input id="food-carbs" type="number" step="0.1" min="0" placeholder="g" />
            </label>
            <label>🧈 Grăsimi
              <input id="food-fat" type="number" step="0.1" min="0" placeholder="g" />
            </label>
            <label>🌾 Fibre
              <input id="food-fiber" type="number" step="0.1" min="0" placeholder="g" />
            </label>
          </div>
          <div class="row">
            <span id="food-status" class="muted"></span>
            <button type="submit">Salvează produsul</button>
          </div>
        </form>
      </section>

      <!-- Lista produse -->
      <section class="card">
        <h2>📦 Produsele mele</h2>
        <div id="food-list" class="history"></div>
      </section>
    </main>

    <script src="foods.js"></script>
    <script src="parser.js"></script>
    <script src="store.js"></script>
    <script src="localapi.js"></script>
    <script src="common.js"></script>
    <script src="foods_page.js"></script>
  </body>
</html>
